name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the format vX.Y.Z; received: ${tag}" >&2
            exit 1
          fi

          tag_version="${tag#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${tag_version}" != "${manifest_version}" || "${tag_version}" != "${package_version}" ]]; then
            echo "Version mismatch:" >&2
            echo "  tag:      ${tag_version}" >&2
            echo "  manifest: ${manifest_version}" >&2
            echo "  package:  ${package_version}" >&2
            exit 1
          fi

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Package extension
        id: package
        shell: bash
        run: |
          set -euo pipefail

          archive_name="cityu-tronclass-plugin-${GITHUB_REF_NAME}.zip"
          staging_dir="${RUNNER_TEMP}/cityu-tronclass-plugin"

          rm -rf "${staging_dir}"
          mkdir -p "${staging_dir}"
          cp manifest.json background.js dashboard.html dashboard.css dashboard.js privacy.html README.md LICENSE "${staging_dir}/"
          cp -R icons images lib "${staging_dir}/"

          (
            cd "${staging_dir}"
            zip -r "${GITHUB_WORKSPACE}/${archive_name}" .
          )

          echo "archive=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            --verify-tag \
            --title "CityU TronClass Plugin ${GITHUB_REF_NAME}" \
            --generate-notes
