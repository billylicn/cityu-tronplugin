name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the format vX.Y.Z; received: ${tag}" >&2
            exit 1
          fi

          tag_version="${tag#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${tag_version}" != "${manifest_version}" || "${tag_version}" != "${package_version}" ]]; then
            echo "Version mismatch:" >&2
            echo "  tag:      ${tag_version}" >&2
            echo "  manifest: ${manifest_version}" >&2
            echo "  package:  ${package_version}" >&2
            exit 1
          fi

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Package extension
        id: package
        shell: bash
        run: |
          set -euo pipefail

          archive_name="cityu-tronclass-plugin-${GITHUB_REF_NAME}.zip"
          staging_dir="${RUNNER_TEMP}/cityu-tronclass-plugin"

          rm -rf "${staging_dir}"
          mkdir -p "${staging_dir}"
          cp manifest.json background.js dashboard.html dashboard.css dashboard.js privacy.html README.md LICENSE "${staging_dir}/"
          cp -R icons images lib "${staging_dir}/"

          (
            cd "${staging_dir}"
            zip -r "${GITHUB_WORKSPACE}/${archive_name}" .
          )

          echo "archive=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            > [!IMPORTANT]
            > 从旧版本更新时，请先在 `chrome://extensions/` 中删除旧版 CityU TronClass Plugin，再安装本次下载的新版本。
            >
            > 删除旧扩展会同时清除插件的本地缓存、页面布局和忽略设置，但不会修改 TronClass 原站中的课程、作业、考勤或文件数据。

            ## 从旧版本更新

            1. 在 Assets 中下载 `cityu-tronclass-plugin-${{ github.ref_name }}.zip`。
            2. 将 ZIP 完整解压，不能直接加载 ZIP 文件。
            3. 打开 `chrome://extensions/`。
            4. 找到旧版 CityU TronClass Plugin，点击“移除”。
            5. 开启右上角“开发者模式”。
            6. 点击“加载已解压的扩展程序”，选择刚刚解压的新版本目录。
            7. 登录 TronClass，然后点击扩展图标重新打开插件。

            ## 首次安装

            1. 在 Assets 中下载本 Release 的 ZIP 安装包。
            2. 将 ZIP 完整解压。
            3. 打开 `chrome://extensions/` 并开启“开发者模式”。
            4. 点击“加载已解压的扩展程序”。
            5. 选择解压后、根目录中包含 `manifest.json` 的文件夹。
            6. 登录澳门城市大学 TronClass，然后点击扩展图标。

            ## 本次更新内容

            以下内容由 GitHub 根据本版本的提交和合并记录自动生成。
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            --verify-tag \
            --title "CityU TronClass Plugin ${GITHUB_REF_NAME}" \
            --notes "${RELEASE_NOTES}" \
            --generate-notes
